<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            親屬計算機
        </title>
        <link rel="icon" href="icon.webp" type="image/png"/>
        <link rel="stylesheet" href="index.css" type="text/css"/>
    </head>
    <body>
        <div id="board">
            <div id="question">
                <span id="question_text"></span>
            </div>
            <div id="answer">
                <span id="answer_text"></span>
            </div>
        </div>
        <div id="all_clear" class="button" onclick="javascript:all_clear()">
            <div class="hover_background"></div>
            <span class="button_text">
                AC
            </span>
        </div>
        <div id="back" class="button" onclick="javascript:back()">
            <div class="hover_background"></div>
            <span class="button_text">
                &larr;
            </span>
        </div>
        <div id="dad" class="button" onclick="javascript:calculate(0)">
            <div class="hover_background"></div>
            <span class="button_text">
                爸爸
            </span>
        </div>
        <div id="mom" class="button" onclick="javascript:calculate(1)">
            <div class="hover_background"></div>
            <span class="button_text">
                媽媽
            </span>
        </div>
        <div id="older_brother" class="button" onclick="javascript:calculate(2)">
            <div class="hover_background"></div>
            <span class="button_text">
                哥哥
            </span>
        </div>
        <div id="younger_brother" class="button" onclick="javascript:calculate(3)">
            <div class="hover_background"></div>
            <span class="button_text">
                弟弟
            </span>
        </div>
        <div id="older_sister" class="button" onclick="javascript:calculate(4)">
            <div class="hover_background"></div>
            <span class="button_text">
                姊姊
            </span>
        </div>
        <div id="younger_sister" class="button" onclick="javascript:calculate(5)">
            <div class="hover_background"></div>
            <span class="button_text">
                妹妹
            </span>
        </div>
        <div id="husband" class="button" onclick="javascript:calculate(6)">
            <div class="hover_background"></div>
            <span class="button_text">
                丈夫
            </span>
        </div>
        <div id="wife" class="button" onclick="javascript:calculate(7)">
            <div class="hover_background"></div>
            <span class="button_text">
                妻子
            </span>
        </div>
        <div id="older_son" class="button" onclick="javascript:calculate(8)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                兒子(較年長)
            </span>
        </div>
        <div id="younger_son" class="button" onclick="javascript:calculate(9)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                兒子(較年輕)
            </span>
        </div>
        <div id="older_daughter" class="button" onclick="javascript:calculate(10)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                女兒(較年長)
            </span>
        </div>
        <div id="younger_daughter" class="button" onclick="javascript:calculate(11)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                女兒(較年輕)
            </span>
        </div>
        <div id="boy_me" class="button" onclick="javascript:calculate(12)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                我(男)
            </span>
        </div>
        <div id="girl_me" class="button" onclick="javascript:calculate(13)">
            <div class="hover_background"></div>
            <span class="button_text shrink">
                我(女)
            </span>
        </div>
        <div id="equal" class="button" onclick="javascript:equal()">
            <div class="hover_background"></div>
            <span class="button_text">
                =
            </span>
        </div>
        <script src="relations.js"></script>
        <script src="index.js"></script>
    </body>
</html>
